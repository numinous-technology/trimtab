# The store behind an HTTP API, plus the operator that turns InferenceConfig
# objects into versions. Daemons in engine pods point --db at the Service.
apiVersion: v1
kind: Namespace
metadata: {name: trimtab}
---
apiVersion: v1
kind: Secret
metadata: {name: trimtab-token, namespace: trimtab}
stringData: {token: change-me}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: trimtab-store, namespace: trimtab}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: trimtab-controlplane, namespace: trimtab}
spec:
  replicas: 1
  selector: {matchLabels: {app: trimtab-controlplane}}
  template:
    metadata: {labels: {app: trimtab-controlplane}}
    spec:
      containers:
        - name: server
          image: ghcr.io/numinous-technology/trimtab:latest
          command: [python3, -m, trimtab.server, --db, /data/trimtab.db, --port, "7070", --token, $(TRIMTAB_TOKEN)]
          env:
            - name: TRIMTAB_TOKEN
              valueFrom: {secretKeyRef: {name: trimtab-token, key: token}}
          ports: [{containerPort: 7070}]
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe: {httpGet: {path: /health, port: 7070}}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: trimtab-store}
---
apiVersion: v1
kind: Service
metadata: {name: trimtab-controlplane, namespace: trimtab}
spec:
  selector: {app: trimtab-controlplane}
  ports: [{port: 7070, targetPort: 7070}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: trimtab-operator, namespace: trimtab}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: trimtab-operator}
rules:
  - apiGroups: [trimtab.numinous.technology]
    resources: [inferenceconfigs]
    verbs: [get, list, watch]
  - apiGroups: [trimtab.numinous.technology]
    resources: [inferenceconfigs/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: trimtab-operator}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: trimtab-operator}
subjects: [{kind: ServiceAccount, name: trimtab-operator, namespace: trimtab}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: trimtab-operator, namespace: trimtab}
spec:
  replicas: 1
  selector: {matchLabels: {app: trimtab-operator}}
  template:
    metadata: {labels: {app: trimtab-operator}}
    spec:
      serviceAccountName: trimtab-operator
      containers:
        - name: operator
          image: ghcr.io/numinous-technology/trimtab:latest
          command: [python3, -m, trimtab.operator, --db, http://trimtab-controlplane:7070, --engine, sglang]
          env:
            - name: TRIMTAB_TOKEN
              valueFrom: {secretKeyRef: {name: trimtab-token, key: token}}
