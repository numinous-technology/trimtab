# trimtab knob manifest for SGLang master commit 3315356 (2026-09-01).
# klass is hot or cold. hot means the scheduler loop reads the value every
# step and trimtab can change it live. cold means the value is baked into
# GPU memory layout or graph capture at boot and needs a reinit.
# verified_at records the scheduler.py line where the per-step read was
# confirmed, since a knob is only hot if the loop actually reads it.

engine: sglang
engine_commit: "3315356"

knobs:
  - field: max_running_requests
    klass: hot
    verified_at: "scheduler.py 2274, 2302, 3626"
    validator:
      type: int
      min: 1
      max_source: boot_value   # the physical ceiling recorded at first call
    note: logical cap under the KV pool and captured graphs allocated at boot

  - field: max_queued_requests
    klass: hot
    verified_at: "scheduler.py 3077"
    validator:
      type: int
      min: 0

  - field: chunked_prefill_size
    klass: hot
    verified_at: "scheduler.py 3600"
    validator:
      type: int
      min: 1

  - field: max_prefill_tokens
    klass: hot
    verified_at: "scheduler.py 3621 (PrefillAdder built per batch)"
    validator:
      type: int
      min: 1
      max_source: kv_pool
    note: engine caps it at max_total_num_tokens

  - field: schedule_policy
    klass: hot
    verified_at: "schedule_policy.py 257, 294, 297 (SchedulePolicy.policy read in calc_priority every batch)"
    validator:
      type: str
      choices: fcfs,lpm,dfs-weight,lof,random,priority
    note: applied through SchedulePolicy._validate_and_adjust_policy, so a cache-aware policy falls back to fcfs when the radix cache is off

  - field: schedule_conservativeness
    klass: hot
    verified_at: "scheduler.py 3620, 3890-3948 (new_token_ratio_tracker read on every retract/decay step)"
    validator:
      type: float
      min: 0.01
    note: rebuilds the tracker's init, min and decay the same way from_config does

  - field: log_level
    klass: hot
    verified_at: "python logging, read on every log call"
    validator:
      type: str
      choices: DEBUG,INFO,WARNING,ERROR

  # stock set_internal_state allowlist, present upstream before trimtab
  - field: pp_max_micro_batch_size
    klass: hot
    origin: upstream
  - field: speculative_accept_threshold_single
    klass: hot
    origin: upstream
    validator:
      type: float
  - field: speculative_accept_threshold_acc
    klass: hot
    origin: upstream
    validator:
      type: float
  - field: dspark_force_budget_frac
    klass: hot
    origin: upstream
    validator:
      type: float
  - field: dspark_clear_info_records
    klass: hot
    origin: upstream

  # cold with a reason, so nobody re-investigates
  - field: speculative_num_steps
    klass: cold
    note: draft CUDA graphs are captured for a fixed depth at boot
  - field: speculative_num_draft_tokens
    klass: cold
    note: same, sized into the draft pipeline at boot
  - field: watchdog_timeout
    klass: cold
    note: passed by value into the watchdog thread at boot

  - field: tp_size
    klass: cold
  - field: ep_size
    klass: cold
  - field: quantization
    klass: cold
  - field: kv_cache_dtype
    klass: cold
  - field: mem_fraction_static
    klass: warm
    note: in-place reinit, pools and graphs rebuilt, weights stay on the GPU, needs --enable-memory-saver
  - field: max_total_num_tokens
    klass: warm
    note: same path, sets --max-total-tokens for the rebuilt pool
  - field: cuda_graph_max_bs
    klass: cold
  - field: attention_backend
    klass: cold
  - field: speculative_algorithm
    klass: cold
  - field: speculative_draft_model_path
    klass: cold
  - field: page_size
    klass: cold
